input {
  stdin { }
}
filter {
  grok {
    match => { "message" => "%{WORD:firstname} %{WORD:lastname} %{NUMBER:age}" }
  }
}
output {
  stdout { }
  csv {
    fields => ["firstname", "lastname", "age"]
    path => "/home/cloud_user/stdin2file_and_csv.csv"
  }
  file {
    path => "/home/cloud_user/stdin2file_and_csv.log"
  }
  elasticsearch {
    hosts => ["https://logstash:passwd123@172.31.31.246:9200"]
    ssl_certificate_authorities => "/home/cloud_user/http_ca.crt"
    ssl_verification_mode => none
    ssl_enabled => true
    index => "udemy-log"
    doc_as_upsert => true
  }
}
